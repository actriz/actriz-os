backend = "glx";
vsync = true;

shadow = false;
shadow-radius = 10;
shadow-exclude = [
  "class_g = 'ActrizIsla'", "class_g = 'ActrizIslaBajo'",
  "class_g = 'KeuDock'", "class_g = 'BoteReloj'",
  "class_g = 'BoteWifiBat'", "class_g = 'Borde'",
  "window_type = 'menu'", "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'", "window_type = 'tooltip'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_STICKY'"
];

fading = true;
fade-in-step = 0.10;
fade-out-step = 0.10;
fade-delta = 5;
active-opacity = 0.90;
inactive-opacity = 0.90;
frame-opacity = 1.0;

corner-radius = 10;
rounded-corners-exclude = [
  "class_g = 'ActrizIsla'", "class_g = 'ActrizIslaBajo'",
  "class_g = 'KeuDock'", "class_g = 'BoteReloj'",
  "class_g = 'BoteWifiBat'", "class_g = 'Borde'",
  "window_type = 'dock'", "window_type = 'desktop'"
];

# Blur SOLO detrás de alacritty (terminal semitransparente)
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 10;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'dock'", "window_type = 'desktop'",
  "class_g = 'ActrizIsla'", "class_g = 'ActrizIslaBajo'",
  "class_g = 'KeuDock'", "class_g = 'BoteReloj'",
  "class_g = 'BoteWifiBat'", "class_g = 'Borde'"
];

opacity-rule = [
  "100:class_g = 'ActrizIsla'", "100:class_g = 'ActrizIslaBajo'",
  "100:class_g = 'KeuDock'", "100:class_g = 'BoteReloj'",
  "100:class_g = 'BoteWifiBat'", "100:class_g = 'Borde'",
  "100:window_type = 'menu'", "100:window_type = 'popup_menu'",
  "100:window_type = 'dropdown_menu'"
];









# ─── Animaciones: solo open/close (lo único posible en i3 tiling) ──
animations = ({
    triggers = ["open", "show"];
    opacity = { curve = "linear"; duration = 0.15; start = 0; end = "window-raw-opacity"; };
    scale-x = { curve = "cubic-bezier(0.34, 1.5, 0.64, 1)"; duration = 0.20; start = 0.85; end = 1; };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
},{
    triggers = ["close", "hide"];
    opacity = { curve = "linear"; duration = 0.12; start = "window-raw-opacity-before"; end = 0; };
    scale-x = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.15; start = 1; end = 0.85; };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
})


# ═══════════════════════════════════════════════════════════════
#  ANIMACIONES COMPLETAS (picom-jonaburg)
# ═══════════════════════════════════════════════════════════════

# ─── 1. TRANSICIONES DE MOVIMIENTO (tiles que se reorganizan) ──
# transition-length: duración del slide en ms
# transition-pow-*: curva de easing (0.1 = suave, 0.5+ = más rebote)
# size-transition: anima también el cambio de tamaño

transition-length = 250;
transition-pow-x = 0.25;
transition-pow-y = 0.25;
transition-pow-w = 0.25;
transition-pow-h = 0.25;
size-transition = false;


# ─── 3. EXCLUSIONES (no animar los widgets del escritorio) ─────
    "class_g = 'ActrizIsla'",
    "class_g = 'ActrizIslaBajo'",
    "class_g = 'KeuDock'",
    "class_g = 'BoteReloj'",
    "class_g = 'BoteWifiBat'",
    "class_g = 'Borde'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

